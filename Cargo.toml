[workspace]
resolver = "2"
members = [
    "crates/orbity-core",
    "crates/orbity-storage",
    "crates/orbity-sandbox",
    "crates/orbity-graph",
    "crates/orbity-agent",
    "crates/orbity-telemetry",
    "crates/orbity-server",
    "crates/orbity-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Meza Agentic Team <team@meza.ai>"]
license = "MIT"
repository = "https://github.com/meza/meza-agentic-orchestrator"

[workspace.dependencies]
# Internal crates
orbity-core = { path = "crates/orbity-core" }
orbity-storage = { path = "crates/orbity-storage" }
orbity-sandbox = { path = "crates/orbity-sandbox" }
orbity-graph = { path = "crates/orbity-graph" }
orbity-agent = { path = "crates/orbity-agent" }
orbity-telemetry = { path = "crates/orbity-telemetry" }
orbity-server = { path = "crates/orbity-server" }

# Async runtime & utilities
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization & formatting
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Cryptography & hashing
sha2 = "0.10"
hex = "0.4"

# Database & persistence
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "chrono", "uuid", "migrate"] }

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env"] }

# Errors & Tracing
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
