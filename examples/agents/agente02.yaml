# ==============================================================================
# Agente / Sub-orquestrador: agente02.yaml
# Descrição: Agente focado em auditoria de segurança e testes de fuzzing
# ==============================================================================
version: "1.0"
agent:
  id: "agt_02m84k1z"
  name: "Agente02-SecuritySentry"
  tags:
    - "security"
    - "fuzzing"
    - "audit"

  # Política Declarativa de Aprovação e Rejeição
  approval_policy:
    mode: "automatic" # Modo autônomo sem bloqueios manuais para auditoria e fuzzing
    auto_approve:
      - rule: "sandbox_security_tests"
        patterns: ["cargo test --test security_tests*"]
    auto_reject:
      - rule: "host_filesystem_leak"
        patterns: ["*~/.ssh*", "*--privileged*"]
    fallback_action: "reject"

  # Orquestrador interno
  orchestrator:
    type: "embedded"
    runner: "claude" # Claude Code como motor analítico do orquestrador
    cli_options:
      output_format: "json"
    prompt:
      system: |
        Você é o orquestrador do Agente02. Sua missão é caçar vulnerabilidades,
        auditar chamadas de sistema na Sandbox e validar limites de memória.

    plan:
      strategy: "Sequential"
      steps:
        - name: "Análise Estática de Vulnerabilidades"
          delegate_to: "claude_auditor"
        - name: "Fuzzing e Testes Confinados"
          delegate_to: "codex_tester"
          sandbox_action: "cargo test --test security_tests"

    # Time sob comando deste agente
    team:
      - id: "claude_auditor"
        role: "Vulnerability & Static Analysis"
        runner: "claude"
        cli_args: ["--print", "--output-format", "json"]

      - id: "codex_tester"
        role: "Fuzzing & Test Execution"
        runner: "codex"
        cli_subcommand: "exec"
