# ==============================================================================
# Agente / Sub-orquestrador: agente01.yaml
# Descrição: Agente autônomo baseado na tríade Codex CLI, Claude Code e Agy Antigravity
# ==============================================================================
version: "1.0"
agent:
  id: "agt_01h89x2k"
  name: "Agente01"
  provider: "agy"
  tier: "balanced"
  tags:
    - "refactoring"
    - "sqlite"
    - "cli-triad"

  # Política Declarativa de Aprovação e Rejeição
  approval_policy:
    mode: "automatic" # Executa sem solicitar validações humanas repetitivas
    auto_approve:
      - rule: "safe_inspection_and_cargo"
        tools: ["codex", "claude", "agy"]
        patterns: ["cargo test*", "cargo check*", "git diff*"]
    auto_reject:
      - rule: "prohibited_patterns"
        patterns: ["*id_rsa*", "*sudo *", "rm -rf *"]
    fallback_action: "approve"

  # Orquestrador interno obrigatório
  orchestrator:
    type: "embedded"
    name: "Agente01-Lead"
    provider: "agy"
    tier: "balanced"
    runner: "agy" # Antigravity CLI como motor de raciocínio do orquestrador
    cli_options:
      mode: "plan"
      effort: "medium"
    prompt:
      system: |
        Você é o orquestrador do Agente01. Sua missão é coordenar refatorações com SQLite WAL
        e validação de integridade criptográfica SHA-256 usando Codex CLI e Claude Code.

    plan:
      strategy: "Sequential"
      steps:
        - name: "Analisar Código Existente"
          delegate_to: "agy_analyzer"
        - name: "Escrever Código e Migrações"
          delegate_to: "codex_coder"
        - name: "Validar e Revisar em Sandbox"
          delegate_to: "claude_reviewer"

    # Time de operários ao redor deste agente
    team:
      - id: "codex_coder"
        name: "Codex Rust Coder"
        provider: "codex"
        tier: "balanced"
        role: "Rust Code Implementation"
        runner: "codex"
        cli_subcommand: "exec"

      - id: "claude_reviewer"
        name: "Claude Security Reviewer"
        provider: "claude"
        tier: "reasoning"
        role: "Code Review & Security Analysis"
        runner: "claude"
        cli_args: ["--print", "--output-format", "json"]

      - id: "agy_analyzer"
        name: "Agy Architecture Analyzer"
        provider: "agy"
        tier: "fast"
        role: "Deep Research & Architecture Analysis"
        runner: "agy"
        cli_args: ["--print", "--output-format", "json"]
