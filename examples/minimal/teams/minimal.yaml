# Exemplo mínimo de equipe Orbity.
version: "1.0"
team:
  name: "minimal"
  description: "Equipe mínima com um worker e uma etapa"
  orchestrator:
    id: "minimal-lead"
    name: "Minimal Lead"
    runner: "codex"
    plan:
      strategy: "Sequential"
      steps:
        - step_id: "execute"
          name: "Executar tarefa"
          delegate_to: "minimal-worker"
          action: "codex.exec"
  workers:
    - id: "minimal-worker"
      name: "Minimal Worker"
      provider: "codex"
      runner: "codex"
