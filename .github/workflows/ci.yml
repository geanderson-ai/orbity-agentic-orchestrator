name: Rust CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    name: Format, Clippy, Test & Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap sqlite3 libsqlite3-dev pkg-config build-essential

      - name: Check Code Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint Workspace with Zero Warnings (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Full Workspace Test Suite (cargo test)
        run: cargo test --workspace

      - name: Compile Release Workspace Binary (cargo build --release)
        run: cargo build --release --workspace
